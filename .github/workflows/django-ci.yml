name: Django CI

on:
  workflow_dispatch:        # lets you manually trigger from Actions tab
  push:
    branches: [main, dev]   # test on dev too, since that's your team's active branch
    paths:
      - 'backend/**'
  pull_request:
    branches: [main, dev]
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
      DJANGO_SETTINGS_MODULE: config.settings
      DB_SSL_REQUIRE: "false"
      DB_SSLMODE: "disable"
      DJANGO_SECRET_KEY: test-secret-key
      DEBUG: "False"
      # Tests must not read or write the shared Upstash cache (tests also force local memory)
      UPSTASH_REDIS_REST_URL: ""
      UPSTASH_REDIS_REST_TOKEN: ""
      REDIS_URL: ""
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run migrations
        run: python manage.py migrate

      - name: Lint (flake8)
        run: |
          pip install flake8
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=migrations,venv,.venv
          # Exit-zero treats formatting/style warnings as non-fatal warnings
          flake8 . --count --exit-zero --max-line-length=120 --statistics --exclude=migrations,venv,.venv

      - name: Clear Python cache
        run: find . -name "__pycache__" -exec rm -rf {} +

      - name: Print DB engine for verification
        run: python -c "from django.conf import settings; print('DB ENGINE:', settings.DATABASES['default']['ENGINE'])"
      - name: Run tests
        run: python manage.py test --verbosity=2
