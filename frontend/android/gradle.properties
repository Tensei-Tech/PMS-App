# gradle.properties
# Project-wide Gradle settings.

# Enable Gradle Daemon for faster subsequent builds
org.gradle.daemon=true

# Enable parallel execution of tasks
org.gradle.parallel=true

# Enable build caching to reuse outputs from previous builds
org.gradle.caching=true

# Optimize JVM arguments for better build performance
# -Xmx4G: Give Gradle up to 4GB of RAM
# -XX:+HeapDumpOnOutOfMemoryError: Helpful for debugging memory issues
# -Dkotlin.daemon.jvm.options: Give Kotlin daemon its own memory pool
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dkotlin.daemon.jvm.options=-Xmx2G

# Enable AndroidX and Jetifier for modern package compatibility (Required for local_auth)
android.useAndroidX=true
android.enableJetifier=true

# Enable incremental Kotlin compilation for faster iterative builds
kotlin.incremental=true

# Experimental: Configuration caching for near-instant build start (uncomment if using Gradle 7+)
# org.gradle.unsafe.configuration-cache=true

# Recommended: Reduce size of R classes in libraries (faster builds, smaller APK)
android.nonTransitiveRClass=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
