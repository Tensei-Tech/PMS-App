name: Build & Release Android APK

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd frontend
          flutter pub get

      # A release APK without API_BASE_URL falls back to 127.0.0.1, which a
      # phone cannot reach ("Could not connect to authentication server").
      - name: Check API_BASE_URL in config/prod.json
        run: |
          url=$(python3 -c "import json; print(json.load(open('frontend/config/prod.json')).get('API_BASE_URL', ''))")
          case "$url" in
            https://*) echo "API_BASE_URL=$url" ;;
            *) echo "::error::frontend/config/prod.json must set API_BASE_URL to an https:// URL (got '$url')"; exit 1 ;;
          esac

      - name: Build Release APK
        run: |
          cd frontend
          flutter build apk --release --android-skip-build-dependency-validation --dart-define-from-file=config/prod.json

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PMS-App-Release-APK
          path: frontend/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
