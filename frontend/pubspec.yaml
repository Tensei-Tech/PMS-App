name: khakhi_diary
description: "Khakhi Diary - Police Management System for Maharashtra Police."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2
  local_auth: ^2.3.0
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^10.0.0
  provider: ^6.1.2
  pin_code_fields: ^9.3.0
  intl: ^0.20.2
  fl_chart: ^1.2.0
  table_calendar: ^3.1.2
  animate_do: ^4.2.0
  lottie: ^3.1.2
  shimmer: ^3.0.0
  carousel_slider: ^5.0.0
  font_awesome_flutter: ^11.0.0
  flutter_local_notifications: ^21.0.0
  smooth_page_indicator: ^2.0.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  pdf: ^3.11.0
  printing: ^5.13.2
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_storage: ^13.3.0
  firebase_messaging: ^16.2.0
  crypto: ^3.0.3
  timezone: ^0.11.1
  csv: ^6.0.0
  http: ^1.6.0
  uuid: ^4.5.1
  collection: ^1.18.0
  flutter_svg: ^2.0.10
# fix
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  firebase_core_platform_interface: ^6.0.3

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/data/india_districts.json
    - assets/data/maharashtra_police_stations.csv
    - assets/reports/form_v.png
    - assets/icons/
