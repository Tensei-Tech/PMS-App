  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-messaging-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-storage-compat.js"></script>

  <!-- Browser Web Speech Recognition API Integration -->
  <script>
    window.voiceRecognizer = {
      recognition: null,
      stream: null,
      start: function(langCode) {
        var self = this;
        var SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) {
          window.dispatchEvent(new CustomEvent('voice_status', { 
            detail: { status: 'unsupported', message: 'Speech Recognition is not supported in this browser. Please use Google Chrome or Edge.' } 
          }));
          return;
        }

        var targetLang = langCode || 'en-IN';

        // Check if running inside Brave browser (Brave blocks Google cloud speech recognition)
        if (navigator.brave && typeof navigator.brave.isBrave === 'function') {
          navigator.brave.isBrave().then(function(isBrave) {
            if (isBrave) {
              window.dispatchEvent(new CustomEvent('voice_status', { 
                detail: { 
                  status: 'error', 
                  message: 'Brave Browser disables Google Voice Recognition by default. Please open PMS in Google Chrome or Microsoft Edge to use voice search.' 
                } 
              }));
            } else {
              self._proceedStart(SpeechRec, targetLang);
            }
          }).catch(function() {
            self._proceedStart(SpeechRec, targetLang);
          });
          return;
        }

        self._proceedStart(SpeechRec, targetLang);
      },
      _proceedStart: function(SpeechRec, targetLang) {
        var self = this;
        // Check microphone permission without keeping the audio device locked
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          navigator.mediaDevices.getUserMedia({ audio: true }).then(function(s) {
            // Immediately stop tracks so the device is free for SpeechRecognition
            s.getTracks().forEach(function(t) { t.stop(); });
            self._startSpeech(SpeechRec, targetLang);
          }).catch(function(err) {
            console.warn("getUserMedia error:", err);
            self._startSpeech(SpeechRec, targetLang);
          });
        } else {
          self._startSpeech(SpeechRec, targetLang);
        }
      },
      _startSpeech: function(SpeechRec, targetLang) {
        try {
          if (this.recognition) {
            try { this.recognition.abort(); } catch(e){}
          }
          var rec = new SpeechRec();
          this.recognition = rec;
          rec.continuous = true;
          rec.interimResults = true;
          rec.maxAlternatives = 3;
          rec.lang = targetLang || 'en-IN';

          rec.onstart = function() {
            window.dispatchEvent(new CustomEvent('voice_status', { 
              detail: { status: 'listening', message: 'Listening... Speak now into your mic!' } 
            }));
          };

          rec.onresult = function(event) {
            var text = '';
            for (var i = event.resultIndex; i < event.results.length; ++i) {
              text += event.results[i][0].transcript;
            }
            var isFinal = event.results[event.results.length - 1].isFinal;
            // Strip trailing full stop or punctuation automatically added by speech recognition
            text = text.replace(/[\.\,\?\!]+$/g, '').trim();
            window.dispatchEvent(new CustomEvent('voice_result', { 
              detail: { text: text, isFinal: isFinal } 
            }));
          };

          rec.onerror = function(event) {
            var msg = "Voice error: " + event.error;
            if (event.error === 'not-allowed') {
              msg = "Microphone access blocked. Click the lock icon 🔒 near the address bar to Allow microphone.";
            } else if (event.error === 'network') {
              msg = "Voice service unreachable. Brave Browser blocks Google Speech API — please open in Google Chrome or Edge.";
            } else if (event.error === 'no-speech') {
              msg = "No speech detected. Tap the mic to try speaking again.";
            } else if (event.error === 'audio-capture') {
              msg = "No microphone hardware found. Please plug in a microphone.";
            }
            window.dispatchEvent(new CustomEvent('voice_status', { 
              detail: { status: 'error', message: msg } 
            }));
          };

          rec.onend = function() {
            window.dispatchEvent(new CustomEvent('voice_status', { 
              detail: { status: 'ended', message: 'Microphone stopped' } 
            }));
          };

          rec.start();
        } catch (err) {
          console.error("Speech recognition error:", err);
          window.dispatchEvent(new CustomEvent('voice_status', { 
            detail: { status: 'error', message: 'Could not start microphone: ' + err.message } 
          }));
        }
      },
      stop: function() {
        if (this.recognition) {
          try { this.recognition.stop(); } catch(e){
            try { this.recognition.abort(); } catch(e2){}
          }
          this.recognition = null;
        }
        if (this.stream) {
          try {
            this.stream.getTracks().forEach(function(t) { t.stop(); });
          } catch(e){}
          this.stream = null;
        }
      }
    };
  </script>
</head>
<body>
