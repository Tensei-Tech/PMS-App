name: Django CI
on:
     workflow_dispatch:
     push:
       branches: [main]
       paths:
         - 'backend/**'
     pull_request:
       branches: [main]
       paths:
         - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
      DJANGO_SECRET_KEY: test-secret-key
      DEBUG: "False"

    defaults:
      run:
        working-directory: ./backend   # adjust or remove if Django is at repo root

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate

      - name: Run lint (flake8)
        run: |
          pip install flake8
          flake8 . --max-line-length=120 --exclude=migrations

      - name: Run tests
        run: python manage.py test
