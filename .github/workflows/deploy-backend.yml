name: Deploy Backend (Render)

# CD for the Django backend: once "Django CI" passes on a push to dev, deploy
# exactly that commit to the Render service behind
# https://pms-app-backend.onrender.com, then wait until it is live and healthy.
#
# Setup (once):
#   1. Render > pms-app-backend > Settings > Deploy Hook: copy the URL and save it
#      as the repository secret RENDER_DEPLOY_HOOK_URL.
#   2. Render > Settings > Auto-Deploy: set to "Off" (or "After CI Checks Pass"),
#      otherwise Render also deploys every push, before tests have run.
#   3. Optional, to have this job wait for the deploy result: save a Render API key
#      as RENDER_API_KEY and the service id (srv-...) as RENDER_SERVICE_ID.
#   4. Optional: Settings > Environments > production > Required reviewers, to
#      approve each deploy by hand.
#
# The Android APK is already built and published by build-apk.yml.

on:
  workflow_run:
    workflows: ["Django CI"]
    types: [completed]
    branches: [dev]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA to deploy (leave empty for the latest commit of the chosen branch)"
        required: false
        default: ""

# One deploy at a time; a newer one waits instead of cancelling a deploy mid-way.
concurrency:
  group: deploy-backend-render
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    # Only after a green CI run caused by a push (not a pull request), or by hand.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    environment:
      name: production
      url: https://pms-app-backend.onrender.com/api/
    env:
      HEALTH_URL: https://pms-app-backend.onrender.com/api/
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || inputs.ref || github.sha }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}

    steps:
      - name: Trigger Render deploy
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Secret RENDER_DEPLOY_HOOK_URL is not set (Render > service > Settings > Deploy Hook)."
            exit 1
          fi
          echo "Deploying commit $DEPLOY_SHA"
          response=$(curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}&ref=${DEPLOY_SHA}")
          deploy_id=$(echo "$response" | jq -r '.deploy.id // empty')
          echo "Render deploy id: ${deploy_id:-unknown}"
          echo "DEPLOY_ID=$deploy_id" >> "$GITHUB_ENV"

      - name: Wait for Render deploy to finish
        if: env.RENDER_API_KEY != '' && env.RENDER_SERVICE_ID != '' && env.DEPLOY_ID != ''
        timeout-minutes: 30
        run: |
          while true; do
            status=$(curl -fsS \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Accept: application/json" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" \
              | jq -r '.status')
            echo "Render deploy status: $status"
            case "$status" in
              live) exit 0 ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error::Render deploy $DEPLOY_ID ended with status '$status'. See the Render dashboard logs."
                exit 1 ;;
            esac
            sleep 20
          done

      # Render free instances can take a while to wake up, so allow several tries.
      - name: Health check
        run: |
          # Without the Render API, give the build time to start before checking.
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "Render API not configured; waiting 4 minutes for the deploy before checking health."
            sleep 240
          fi
          for i in $(seq 1 15); do
            if body=$(curl -fsS --max-time 30 "$HEALTH_URL"); then
              echo "$body"
              if echo "$body" | grep -q '"healthy"'; then
                echo "Backend is healthy."
                exit 0
              fi
            fi
            echo "Not healthy yet (try $i of 15); retrying in 20 s..."
            sleep 20
          done
          echo "::error::$HEALTH_URL did not report healthy after the deploy."
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Backend deploy"
            echo "- Commit: \`$DEPLOY_SHA\`"
            echo "- Render deploy id: \`${DEPLOY_ID:-unknown}\`"
            echo "- Service: $HEALTH_URL"
          } >> "$GITHUB_STEP_SUMMARY"
